# Spring 顶层配置
spring:
  mail:
    host: ${TAP_MAIL_HOST:${MAIL_HOST:localhost}}
    port: ${TAP_MAIL_PORT:${MAIL_PORT:25}}
    username: ${TAP_MAIL_USERNAME:${MAIL_USERNAME:}}
    password: ${TAP_MAIL_PASSWORD:${MAIL_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  # 应用名称
  application:
    name: teaching-assistant-backend
  # MySQL 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 数据库连接地址，支持环境变量兜底默认值
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:ptadatabase}?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true&rewriteBatchedStatements=true
    # 数据库账号
    username: ${DB_USERNAME:root}
    # 数据库密码，双层兜底环境变量
    password: ${DB_PASSWORD:${DB_PASS:}}
    # Hikari 连接池参数
    hikari:
      connection-timeout: 20000
      maximum-pool-size: ${DB_POOL_MAX:30}
      minimum-idle: ${DB_POOL_MIN:10}
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 60000
      pool-name: HikariPool-Main
  # JPA / Hibernate ORM 配置
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    show-sql: false
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
          fetch_size: 50
        order_inserts: true
        order_updates: true
        generate_statistics: false
  # Flyway 数据库版本迁移
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: false
    clean-disabled: true
    out-of-order: true
    repair-on-migrate: true
  # Redis 缓存配置
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
          max-wait: 3000ms
      timeout: 5000ms
      connect-timeout: 5000ms
  # Servlet 会话、文件上传
  servlet:
    session:
      timeout: 3600
    multipart:
      max-file-size: 512MB
      max-request-size: 520MB
  # 异步线程池、定时任务线程池
  task:
    execution:
      pool:
        core-size: 8
        max-size: 32
        queue-capacity: 200
        keep-alive: 60s
      thread-name-prefix: async-
    scheduling:
      pool:
        size: 4
      thread-name-prefix: sched-

# MyBatis ORM 映射配置
mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    map-underscore-to-camel-case: true
    local-cache-scope: STATEMENT
  mapper-locations: classpath:/mappers/*.xml
  type-aliases-package: com.tap.backend.academic.entity

# 分页插件 PageHelper
pagehelper:
  helper-dialect: mysql

# 日志级别控制
logging:
  level:
    root: info
    com.tap.backend: info
    org:
      springframework:
        jdbc: warn
        transaction: warn
        web: warn

# Tomcat Web服务容器配置
server:
  port: ${SERVER_PORT:8081}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:200}
      min-spare: ${TOMCAT_MIN_SPARE:20}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:8192}
    accept-count: ${TOMCAT_ACCEPT_COUNT:100}
    connection-timeout: 20000
    keep-alive-timeout: 30000
    max-keep-alive-requests: 100
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain,text/css,application/javascript
    min-response-size: 1024

# SpringBoot Actuator 监控端点
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# 方舟大模型接口密钥
ark:
  api:
    key: ${ARK_API_KEY:}

# 火山引擎大模型配置
volcano:
  api:
    key: ${VOLCANO_API_KEY:}
    model: deepseek-r1-250120

# ========== LeetCode 题目推荐系统配置 ==========
leetcode:
  recommendation:
    # 推荐算法各维度权重
    weights:
      need-match: 0.45
      difficulty-fit: 0.20
      success-prob: 0.15
      novelty: 0.10
      quality: 0.10
      repeat-penalty: 0.15
    # 召回策略比例
    recall:
      weak-skill-ratio: 0.60
      difficulty-progression-ratio: 0.25
      exploration-ratio: 0.15
    # 题目多样性控制
    diversity:
      min-easy-count: 2
      min-medium-count: 4
      max-hard-count: 2
    # 推荐缓存过期时间
    cache:
      recommendation-ttl-minutes: 30
      skill-profile-ttl-minutes: 60
  # 力扣 AI 测评（LeetCodeAiEvaluationService）
  ai:
    # 最大输出 token 数；环境变量 LEETCODE_AI_MAX_TOKENS 覆盖（deepseek-v4-flash 项目内参考值 384000，超出 API 上限会返回 400）
    max-tokens: ${LEETCODE_AI_MAX_TOKENS:800}
    connect-timeout-ms: ${LEETCODE_AI_CONNECT_TIMEOUT_MS:8000}
    # 读超时必须 >= eval-timeout-seconds，否则先触发 HTTP 超时
    read-timeout-ms: ${LEETCODE_AI_READ_TIMEOUT_MS:60000}
    eval-timeout-seconds: ${LEETCODE_AI_EVAL_TIMEOUT_SECONDS:55}

# 项目自定义业务配置根节点
tap:
  # 安全、JWT、PTA凭证加密
  security:
    jwt:
      issuer: ${JWT_ISSUER:tap}
      secret: ${JWT_SECRET:}
      access-token-ttl-seconds: ${JWT_TTL_SECONDS:3600}
    pta-credentials:
      secret: ${PTA_CREDENTIALS_SECRET:}
  # 接口调用配额限制
  quota:
    translation-chars-per-day: ${QUOTA_TRANSLATION_CHARS_PER_DAY:200000}
    ai-requests-per-day: ${QUOTA_AI_REQUESTS_PER_DAY:200}
    admin-unlimited: ${QUOTA_ADMIN_UNLIMITED:true}
  # AI大模型多厂商配置
  ai:
    provider: ${AI_PROVIDER:disabled}
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.deepseek.com/v1}
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:deepseek-chat}
    dashscope:
      base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${DASHSCOPE_API_KEY:}
      model: ${DASHSCOPE_MODEL:qwen-vl-max-latest}
    arxiv:
      # 论文检索接口配置，教师共用一套
      enabled: ${ARXIV_API_ENABLED:true}
      search-base-url: ${ARXIV_SEARCH_BASE_URL:https://export.arxiv.org/api/query}
      api-key: ${ARXIV_API_KEY:}
      api-key-header: ${ARXIV_API_KEY_HEADER:}
      max-results: ${ARXIV_MAX_RESULTS:5}
      timeout-seconds: ${ARXIV_TIMEOUT_SECONDS:8}
  # 教师端查询开关控制
  teacher:
    read-path:
      unified-experiment-queries-enabled: ${TAP_TEACHER_UNIFIED_EXPERIMENT_QUERIES_ENABLED:true}
      unified-submission-detail-enabled: ${TAP_TEACHER_UNIFIED_SUBMISSION_DETAIL_ENABLED:true}
      submission-detail-legacy-code-fallback-enabled: ${TAP_TEACHER_SUBMISSION_DETAIL_LEGACY_CODE_FALLBACK_ENABLED:true}
      submission-detail-legacy-report-fallback-enabled: ${TAP_TEACHER_SUBMISSION_DETAIL_LEGACY_REPORT_FALLBACK_ENABLED:true}
      submission-detail-legacy-ai-remarks-fallback-enabled: ${TAP_TEACHER_SUBMISSION_DETAIL_LEGACY_AI_REMARKS_FALLBACK_ENABLED:true}
  # 文档解析、OCR、VLM图文模型
  documents:
    extracted-text-max-chars: ${DOC_EXTRACT_MAX_CHARS:20000}
    store-full-extracted-text-to-minio: ${DOC_STORE_FULL_TEXT_TO_MINIO:true}
    ocr-enabled: ${DOC_OCR_ENABLED:true}
    ocr-command: ${DOC_OCR_COMMAND:tesseract}
    ocr-language: ${DOC_OCR_LANGUAGE:chi_sim+eng}
    ocr-max-pages: ${DOC_OCR_MAX_PAGES:24}
    vlm-fallback-enabled: ${DOC_VLM_FALLBACK_ENABLED:true}
    vlm-max-pages: ${DOC_VLM_MAX_PAGES:8}
  # Agent异步任务调度参数
  agent:
    job-max-concurrency: ${AGENT_JOB_MAX_CONCURRENCY:4}
    doc-max-concurrency: ${AGENT_DOC_MAX_CONCURRENCY:4}
    poll-interval-ms: ${AGENT_POLL_INTERVAL_MS:2000}
    doc-task-max-retries: ${AGENT_DOC_TASK_MAX_RETRIES:3}
  # 压缩包批量解析任务配置
  zip-organize:
    job-max-concurrency: ${ZIP_ORGANIZE_JOB_MAX_CONCURRENCY:1}
    item-max-concurrency: ${ZIP_ORGANIZE_ITEM_MAX_CONCURRENCY:3}
    poll-interval-ms: ${ZIP_ORGANIZE_POLL_INTERVAL_MS:2000}
    max-files: ${ZIP_ORGANIZE_MAX_FILES:120}
    max-zip-bytes: ${ZIP_ORGANIZE_MAX_ZIP_BYTES:52428800}
    extract-text-max-chars: ${ZIP_ORGANIZE_EXTRACT_TEXT_MAX_CHARS:8000}
    ai-text-max-chars: ${ZIP_ORGANIZE_AI_TEXT_MAX_CHARS:5000}
    retry-limit: ${ZIP_ORGANIZE_RETRY_LIMIT:2}
    review-threshold: ${ZIP_ORGANIZE_REVIEW_THRESHOLD:0.6}
  # 翻译服务缓存与厂商
  translation:
    cache-ttl-seconds: ${TRANS_CACHE_TTL_SECONDS:604800}
    provider: ${TRANS_PROVIDER:deepl}
    deepl:
      api-key: ${DEEPL_API_KEY:}
      base-url: ${DEEPL_BASE_URL:https://api-free.deepl.com}
      max-batch-size: ${DEEPL_MAX_BATCH_SIZE:40}
      min-interval-ms: ${DEEPL_MIN_INTERVAL_MS:0}
  # MinIO 对象存储
  storage:
    s3:
      endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:}
      bucket: ${MINIO_BUCKET:tap-files}
  recommendation:
    base-url: ${RECOMMENDATION_SERVICE_BASE_URL:http://127.0.0.1:8003}
    connect-timeout-ms: ${RECOMMENDATION_SERVICE_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${RECOMMENDATION_SERVICE_READ_TIMEOUT_MS:10000}
  error-analysis:
    base-url: ${TAP_ERROR_ANALYSIS_BASE_URL:http://127.0.0.1:8002}
  # RAG 检索增强知识库全套配置
  rag:
    maintenance-mode: ${RAG_MAINTENANCE_MODE:false}
    proxy:
      # RAG 服务地址（RagProxyService 转发用，容器部署时通过 RAG_SERVICE_BASE_URL 覆盖）
      base-url: ${RAG_SERVICE_BASE_URL:http://127.0.0.1:8001}
      connect-timeout-ms: ${RAG_SERVICE_CONNECT_TIMEOUT_MS:10000}
      read-timeout-ms: ${RAG_SERVICE_READ_TIMEOUT_MS:300000}
      stream-read-timeout-ms: ${RAG_SERVICE_STREAM_READ_TIMEOUT_MS:0}
    langchain4j:
      enabled: ${RAG_LANGCHAIN4J_ENABLED:false}
      use-streaming: ${RAG_LANGCHAIN4J_USE_STREAMING:true}
      use-embedding-model: ${RAG_LANGCHAIN4J_USE_EMBEDDING_MODEL:true}
      chat:
        base-url: ${RAG_LANGCHAIN4J_CHAT_BASE_URL:}
        api-key: ${RAG_LANGCHAIN4J_CHAT_API_KEY:}
        model-name: ${RAG_LANGCHAIN4J_CHAT_MODEL_NAME:}
        timeout-seconds: ${RAG_LANGCHAIN4J_CHAT_TIMEOUT_SECONDS:120}
      embedding:
        base-url: ${RAG_LANGCHAIN4J_EMBEDDING_BASE_URL:${RAG_DASHSCOPE_BASE_URL:${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}}}
        api-key: ${RAG_LANGCHAIN4J_EMBEDDING_API_KEY:${DASHSCOPE_API_KEY:}}
        model-name: ${RAG_LANGCHAIN4J_EMBEDDING_MODEL_NAME:text-embedding-v3}
        dimensions: ${RAG_LANGCHAIN4J_EMBEDDING_DIMENSIONS:1024}
        timeout-seconds: ${RAG_LANGCHAIN4J_EMBEDDING_TIMEOUT_SECONDS:30}
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      base-url: ${RAG_DASHSCOPE_BASE_URL:${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}}
      embedding-model: text-embedding-v3
      embedding-dimensions: 1024
    milvus:
      host: ${MILVUS_HOST:127.0.0.1}
      port: ${MILVUS_PORT:19530}
      collection: course_chunks
    retrieval:
      top-k: 20
      top-parent: 5
      score-threshold: 0.5
    fusion:
      alpha: 0.5
      beta: 0.3
      gamma: 0.1
      delta: 0.1
    rerank:
      enabled: true
      provider: heuristic
      endpoint: ${RAG_RERANK_ENDPOINT:http://127.0.0.1:8101/rerank}
      timeout-ms: 2500
      cross-encoder-weight: 0.7
      top-n: 5
      base-weight: 0.45
      overlap-weight: 0.4
      phrase-weight: 0.1
      annotation-weight: 0.05
    mmr:
      lambda: 0.7
    coverage:
      threshold: 0.30
    evidence:
      max-sentences: 8
      token-ratio-min: 0.25
      token-ratio-max: 0.40
    web:
      tavily-api-key: ${TAVILY_API_KEY:}
      enabled: false
    lucene:
      index-path: ${LUCENE_INDEX_PATH:./data/lucene-index}
  # 作业导出批量并发
  grading:
    worker:
      base-url: ${GRADING_WORKER_BASE_URL:http://127.0.0.1:8004}
      connect-timeout-ms: ${GRADING_WORKER_CONNECT_TIMEOUT_MS:10000}
      read-timeout-ms: ${GRADING_WORKER_READ_TIMEOUT_MS:120000}
    libreoffice-executable: ${LIBREOFFICE_EXECUTABLE:}
    export:
      max-concurrency: ${GRADING_EXPORT_MAX_CONCURRENCY:6}
      submit-interval-ms: ${GRADING_EXPORT_SUBMIT_INTERVAL_MS:30}
    # 错误演示真实执行沙箱（Python Tutor 式可视化）
    code-tracer:
      # 留空则自动探测 python3.11 / python3 / python
      python: ${CODE_TRACER_PYTHON:}
      # 留空则按默认路径查找 grading-worker/code_tracer.py 或 /app/tools/code_tracer.py
      script: ${CODE_TRACER_SCRIPT:}
      timeout-ms: ${CODE_TRACER_TIMEOUT_MS:10000}
    # 错误演示执行前 LLM 补强：缺 main/宏时让大模型补可执行代码（补宏、生成真实调用学生函数的 main）
    demo:
      llm-code-prep-enabled: ${GRADING_DEMO_LLM_CODE_PREP_ENABLED:true}
  leetcode:
    dataset-path: ${LEETCODE_DATASET_PATH:datasets/leetcode/solutions_cleaned.json}

# PTA爬虫微服务对接配置
pta:
  spider-url: ${PTA_SPIDER_URL:http://127.0.0.1:8100}
  problem-set-base-url: ${PTA_PROBLEM_SET_BASE_URL:https://pintia.cn/problem-sets}
  connect-timeout-ms: ${PTA_SPIDER_CONNECT_TIMEOUT_MS:5000}
  read-timeout-ms: ${PTA_SPIDER_READ_TIMEOUT_MS:20000}
  scheduler:
    max-concurrency: ${PTA_SYNC_MAX_CONCURRENCY:3}
    submit-interval-ms: ${PTA_SYNC_SUBMIT_INTERVAL_MS:200}
  auto-start: ${PTA_SPIDER_AUTO_START:false}
  start-script: ${PTA_SPIDER_START_SCRIPT:../services/pta_spider/start_spider_api.ps1}
  start-timeout-seconds: ${PTA_SPIDER_START_TIMEOUT_SECONDS:25}
  auto-stop: ${PTA_SPIDER_AUTO_STOP:true}
  stop-script: ${PTA_SPIDER_STOP_SCRIPT:../services/pta_spider/stop_spider_api.ps1}
  stop-timeout-seconds: ${PTA_SPIDER_STOP_TIMEOUT_SECONDS:12}
