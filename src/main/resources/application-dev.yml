# ============================================================
# Dev-only overrides — activate with: --spring.profiles.active=dev
# These values are ONLY safe for local development.
# Production MUST set real values via environment variables.
# ============================================================

spring:
  datasource:
    password: ${DB_PASSWORD:${DB_PASS:}}

tap:
  recommendation:
    base-url: ${RECOMMENDATION_SERVICE_BASE_URL:http://127.0.0.1:8003}
    connect-timeout-ms: ${RECOMMENDATION_SERVICE_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${RECOMMENDATION_SERVICE_READ_TIMEOUT_MS:10000}
  security:
    jwt:
      secret: ${JWT_SECRET:dev_only_jwt_secret_not_for_production_use_1234567890}
    pta-credentials:
      secret: ${PTA_CREDENTIALS_SECRET:dev_only_pta_credentials_secret_not_for_production}
  ai:
    provider: ${AI_PROVIDER:mock}
  translation:
    provider: ${TRANS_PROVIDER:mock}

pta:
  auto-start: ${PTA_SPIDER_AUTO_START:true}

logging:
  level:
    com.tap.backend.bootstrap: debug
