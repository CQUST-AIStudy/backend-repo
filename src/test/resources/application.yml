spring:
  application:
    name: teaching-assistant-backend-test
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:tap_test;MODE=MySQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  sql:
    init:
      mode: never
  data:
    redis:
      host: 127.0.0.1
      port: 0

mybatis:
  mapper-locations: classpath:/mappers/*.xml
  type-aliases-package: com.tap.backend.academic.entity
  configuration:
    map-underscore-to-camel-case: true

tap:
  security:
    jwt:
      issuer: tap-test
      secret: test_jwt_secret_that_is_long_enough_for_hmac_signing
      access-token-ttl-seconds: 3600
    pta-credentials:
      secret: test_pta_credentials_secret
  quota:
    translation-chars-per-day: 200000
    ai-requests-per-day: 200
    admin-unlimited: true
  ai:
    provider: mock
  teacher:
    read-path:
      unified-experiment-queries-enabled: true
      unified-submission-detail-enabled: true
      submission-detail-legacy-code-fallback-enabled: true
      submission-detail-legacy-report-fallback-enabled: true
      submission-detail-legacy-ai-remarks-fallback-enabled: true
  documents:
    extracted-text-max-chars: 20000
    store-full-extracted-text-to-minio: false
    ocr-enabled: false
    vlm-fallback-enabled: false
  agent:
    job-max-concurrency: 1
    doc-max-concurrency: 1
    poll-interval-ms: 60000
    doc-task-max-retries: 1
  zip-organize:
    job-max-concurrency: 1
    item-max-concurrency: 1
    poll-interval-ms: 60000
    max-files: 120
    max-zip-bytes: 52428800
    extract-text-max-chars: 8000
    ai-text-max-chars: 5000
    retry-limit: 1
    review-threshold: 0.6
  translation:
    provider: mock
  storage:
    s3:
      endpoint: http://127.0.0.1:9000
      access-key: minioadmin
      secret-key: minioadmin
      bucket: tap-test
  rag:
    maintenance-mode: true
    langchain4j:
      enabled: false
      use-streaming: false
      use-embedding-model: false
    web:
      enabled: false
    lucene:
      index-path: ./target/test-lucene-index
  grading:
    redis-listener:
      enabled: false
    export:
      max-concurrency: 1
      submit-interval-ms: 0

pta:
  spider-url: http://127.0.0.1:8100
  auto-start: false
  auto-stop: false
  scheduler:
    max-concurrency: 1
    submit-interval-ms: 0

logging:
  level:
    root: warn
    com.tap.backend: warn
