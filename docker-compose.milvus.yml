# Alternate standalone Milvus stack for AI_Ds only.
# Canonical local runtime uses deploy/local/docker-compose.local.yml on 127.0.0.1:19530.
# This file intentionally uses alternate container names and ports to avoid conflicts.
services:
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: ai-ds-alt-milvus-etcd
    command:
      - etcd
      - --advertise-client-urls=http://127.0.0.1:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    volumes:
      - ./milvus-data/etcd:/etcd

  milvus-minio:
    image: minio/minio:latest
    container_name: ai-ds-alt-milvus-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./milvus-data/minio:/data

  milvus-standalone:
    image: milvusdb/milvus:v2.4.4
    container_name: ai-ds-alt-milvus
    command:
      - milvus
      - run
      - standalone
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    ports:
      - "29530:19530"
      - "10091:9091"
    volumes:
      - ./milvus-data/milvus:/var/lib/milvus
    depends_on:
      - milvus-etcd
      - milvus-minio
